name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .

      # No API key and no network to RunPod: the suite drives the real CLI through the in-memory
      # fake provider, which is the point of having one. A CI run that needs a key is a CI run that
      # cannot be trusted by a stranger.
      - name: Test
        env:
          RENTGUARD_PROVIDER: fake
        run: python -m pytest tests -q

      # The floor is a ratchet, not a target: it fails if coverage goes backwards. The target the
      # user set is 94% of the code with 100% of the features, and the floor is raised in the same
      # commit that earns the rise.
      - name: Coverage
        env:
          RENTGUARD_PROVIDER: fake
        run: python tools/coverage.py

      - name: Check the entry point exists
        run: rentguard --version
